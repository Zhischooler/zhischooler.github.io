<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面走丢了 | Zhischooler</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="description" content="你要找的页面不存在或已被移动。" />

  <link rel="icon" href="https://avatars.githubusercontent.com/u/310584762?v=4&size=240" />

  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131820;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #8b98a9;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --radius: 14px;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(640px 320px at 50% -60px, rgba(56, 189, 248, 0.14), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .container {
      flex: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .error-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 0 64px;
    }

    .hero-badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .error-code {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.02em;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: clamp(88px, 22vw, 168px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 24px;
      user-select: none;
    }

    .error-code span {
      display: inline-block;
      background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 52%, #0ea5e9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 32px rgba(56, 189, 248, 0.35));
    }

    .error-code .zero {
      animation: spin 14s linear infinite;
      transform-origin: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: clamp(22px, 4.5vw, 32px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .lead {
      color: var(--muted);
      font-size: 15.5px;
      max-width: 460px;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      line-height: 1.5;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      border: 1px solid transparent;
    }

    .btn-primary { background: var(--accent); color: #041016; }
    .btn-primary:hover { background: #7dd3fc; text-decoration: none; }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    footer {
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--muted); }
    footer a:hover { color: var(--accent); }

    @media (max-width: 540px) {
      .container { padding: 32px 18px 24px; }
      .lead { margin-bottom: 32px; }
      .actions { width: 100%; }
      .btn { flex: 1 1 auto; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <main class="error-page">
      <div class="hero-badge">Error · 404</div>

      <div class="error-code" aria-hidden="true">
        <span>4</span><span class="zero">0</span><span>4</span>
      </div>

      <h1>这个页面走丢了</h1>
      <p class="lead">
        你要找的页面可能已被移动、删除，或者从来就没有存在过。<br />
        不过别担心，回家的路还给你留着。
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="../index.html">🏠 返回首页</a>
        <a class="btn btn-ghost" href="https://github.com/Zhischooler" target="_blank" rel="noopener">🐙 GitHub</a>
      </div>
    </main>

    <footer>
      &copy; 2026 Zhischooler 志校儿 · <a href="../index.html">回到首页</a>
    </footer>

  </div>
</body>
</html>
